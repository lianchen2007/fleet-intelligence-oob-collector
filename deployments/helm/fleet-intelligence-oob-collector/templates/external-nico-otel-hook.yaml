{{- $base := include "fleet-intelligence-oob-collector.fullname" . -}}
{{- if gt (len $base) 45 -}}
{{- $base = printf "%s-%s" ($base | trunc 36 | trimSuffix "-") ($base | sha256sum | trunc 8) -}}
{{- end -}}
{{- $name := printf "%s-nico-otel" $base -}}
{{- $backupName := printf "%s-backup" $name | trunc 63 | trimSuffix "-" -}}
{{- $backup := lookup "v1" "Secret" .Release.Namespace $backupName -}}
{{- $external := .Values.nicoHardwareHealth.external -}}
{{- if or $external.configureOtlp $backup -}}
{{- if or (not .Values.nicoHardwareHealth.enabled) (ne .Values.nicoHardwareHealth.deploymentMode "external") -}}
{{- fail "restore external NICo OTLP settings before changing deploymentMode or disabling NICo" -}}
{{- end -}}
{{- $deployment := required "external.deploymentName is required for automatic NICo OTLP configuration" $external.deploymentName -}}
{{- $container := required "external.containerName is required for automatic NICo OTLP configuration" $external.containerName -}}
{{- $endpoint := .Values.telemetry.endpoint | trim -}}
{{- if .Values.otelGateway.enabled -}}
{{- $endpoint = printf "http://%s:4317" (include "fleet-intelligence-oob-collector.otelGatewayName" .) -}}
{{- end -}}
# Copyright (c) 2026, NVIDIA CORPORATION & AFFILIATES. All rights reserved.
# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: Secret
metadata:
  name: {{ $backupName }}
  labels:
    {{- include "fleet-intelligence-oob-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-nico-otel-backup
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  state.json: {{ if and $backup $backup.data }}{{ index $backup.data "state.json" | default "" | quote }}{{ else }}""{{ end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "fleet-intelligence-oob-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-nico-otel
data:
  config.json: |
    {{ dict "namespace" .Release.Namespace "deployment" $deployment "container" $container "expectedImage" $external.expectedImage "endpoint" $endpoint "release" .Release.Name "backupSecret" $backupName "enabled" $external.configureOtlp "timeoutSeconds" 240 | toJson }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "fleet-intelligence-oob-collector.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "fleet-intelligence-oob-collector.labels" . | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [{{ $deployment | quote }}]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $backupName | quote }}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "fleet-intelligence-oob-collector.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- range $operation := list "apply" "restore" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s" $name $operation | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "fleet-intelligence-oob-collector.labels" $ | nindent 4 }}
    app.kubernetes.io/component: external-nico-otel
  annotations:
    helm.sh/hook: {{ if eq $operation "apply" }}post-install,post-upgrade{{ else }}pre-delete{{ end }}
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: external-nico-otel
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure-nico
          image: {{ include "fleet-intelligence-oob-collector.image" $ | quote }}
          imagePullPolicy: {{ $.Values.bmcCollector.image.pullPolicy }}
          args:
            - configure-external-nico
            - --config
            - /etc/fleet-intelligence-nico/config.json
            {{- if eq $operation "restore" }}
            - --restore
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: integration-config
              mountPath: /etc/fleet-intelligence-nico
              readOnly: true
      volumes:
        - name: integration-config
          configMap:
            name: {{ $name }}
{{- end }}
{{- end }}
